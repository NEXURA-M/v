<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Facebook Reels Generator & Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { margin-top: 0; color: #1877f2; text-align: center; font-size: 1.5rem; }
    .input-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #1877f2; }
    button { width: 100%; padding: 0.75rem; border-radius: 6px; border: none; background: #1877f2; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1160c4; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #resultBox { margin-top: 1.5rem; display: none; }
    .badge-container { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: center; }
    .fb-badge { background: #1877f2; color: #fff; font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; }
    .ai-badge { background: #8b5cf6; color: #fff; font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
    
    .fb-container { width: 100%; max-width: 320px; height: 500px; background: #000; border-radius: 12px; overflow: hidden; margin: 0 auto 1rem auto; border: 1px solid #334155; }
    iframe { width: 100%; height: 100%; border: none; }
    
    .title-text { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; margin-bottom: 8px; text-align: center; line-height: 1.4; }
    
    .download-options { margin-top: 10px; }
    .btn-download-vidmate { display: block; width: 100%; text-align: center; padding: 0.75rem; background: #ea580c; color: white; font-weight: bold; border-radius: 6px; text-decoration: none; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
    .btn-download-vidmate:hover { background: #c2410c; }
    
    .status { text-align: center; color: #38bdf8; margin: 10px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>AI Facebook Video Generator</h2>
  <div class="input-group">
    <label for="promptInput">Enter AI Facebook Video Prompt:</label>
    <input type="text" id="promptInput" value="banana dance" placeholder="e.g. banana dance">
  </div>

  <button id="genBtn" onclick="searchAIFacebook()">Generate FB Video</button>

  <div id="status" class="status"></div>

  <div id="resultBox">
    <div class="badge-container">
      <span class="fb-badge">📘 FACEBOOK REEL</span>
      <span class="ai-badge">✨ AI GENERATED</span>
    </div>
    <div class="title-text" id="videoTitle"></div>
    <div class="fb-container">
      <iframe id="fbPlayer" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <!-- VidMate App Download Only -->
    <div class="download-options">
      <a id="downloadVidmateBtn" href="#" class="btn-download-vidmate">📥 Download in VidMate App</a>
    </div>
  </div>
</div>

<script>
  function searchAIFacebook() {
    const userPrompt = document.getElementById('promptInput').value.trim();
    if (!userPrompt) return alert('Karam karke prompt enter karein!');

    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('genBtn');
    const player = document.getElementById('fbPlayer');
    const downloadVidmateBtn = document.getElementById('downloadVidmateBtn');
    const videoTitle = document.getElementById('videoTitle');

    btn.disabled = true;
    status.innerText = 'Searching Facebook AI Videos... Please wait';
    resultBox.style.display = 'none';

    try {
      // Direct Facebook Search URL for AI Videos/Reels
      const fbSearchUrl = `https://www.facebook.com/watch/search/?q=${encodeURIComponent(userPrompt + ' AI video')}`;
      
      videoTitle.innerText = `AI Facebook Videos for: "${userPrompt}"`;
      
      // Facebook Embed Player
      player.src = `https://www.facebook.com/plugins/page.php?href=${encodeURIComponent(fbSearchUrl)}&tabs=timeline&width=320&height=500&small_header=true&adapt_container_width=true&hide_cover=true&show_facepile=false`;

      // VidMate Deep Link for Facebook
      const encodedFbUrl = encodeURIComponent(fbSearchUrl);
      downloadVidmateBtn.href = `intent://url?url=${encodedFbUrl}#Intent;package=com.nemo.vidmate;scheme=vidmate;end`;
      
      downloadVidmateBtn.onclick = function() {
        setTimeout(() => {
          window.location.href = `vidmate://url?url=${encodedFbUrl}`;
        }, 500);
      };

      status.innerText = '';
      resultBox.style.display = 'block';
    } catch (err) {
      status.innerText = 'Error loading Facebook video. Try again.';
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
