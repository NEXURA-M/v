<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator & Direct Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #161e2e; padding: 2rem; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid #273549; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    .input-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0b0f19; color: #fff; font-size: 1rem; outline: none; }
    button { width: 100%; padding: 0.75rem; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    #resultBox { margin-top: 1.5rem; display: none; }
    .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; border: 1px solid #334155; }
    iframe { width: 100%; height: 100%; border: none; }
    .btn-download { display: block; width: 100%; text-align: center; padding: 0.8rem; background: #16a34a; color: white; font-weight: bold; border-radius: 6px; text-decoration: none; font-size: 1rem; }
    .btn-download:hover { background: #15803d; }
    .status { text-align: center; color: #94a3b8; margin: 10px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>AI Video Player & Downloader</h2>

  <div class="input-group">
    <label for="promptInput">Enter Video Prompt:</label>
    <input type="text" id="promptInput" value="banana dance" placeholder="e.g. banana dance">
  </div>

  <button id="genBtn" onclick="generateAndLink()">Generate Video</button>

  <div id="status" class="status"></div>

  <div id="resultBox">
    <div class="video-container">
      <iframe id="videoFrame" src="" allowfullscreen></iframe>
    </div>
    <a id="downloadBtn" href="#" target="_blank" class="btn-download">Download Video Stream</a>
  </div>
</div>

<script>
  async function generateAndLink() {
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) return alert('Prompt likhein!');

    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('genBtn');

    btn.disabled = true;
    status.innerText = 'Searching and framing video...';
    resultBox.style.display = 'none';

    try {
      // Invidious API for zero-key search
      const response = await fetch(`https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(prompt)}`);
      const data = await response.json();

      if (data && data.length > 0) {
        const videoId = data[0].videoId;

        // Player Iframe Source
        document.getElementById('videoFrame').src = `https://invidious.nerdvpn.de/embed/${videoId}?autoplay=1`;
        
        // Direct Download Link (ssyoutube direct link format)
        document.getElementById('downloadBtn').href = `https://www.ssyoutube.com/watch?v=${videoId}`;

        status.innerText = '';
        resultBox.style.display = 'block';
      } else {
        status.innerText = 'Koi video nahi mili. Doosra prompt try karein.';
      }
    } catch (err) {
      // Fallback if public instance fails
      const encoded = encodeURIComponent(prompt);
      document.getElementById('downloadBtn').href = `https://ssyoutube.com/results?search_query=${encoded}`;
      status.innerText = 'Direct redirect mode fallback ready.';
      resultBox.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
