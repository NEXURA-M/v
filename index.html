<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator & Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 1.5rem; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: -10px; margin-bottom: 20px; }
    .input-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 0.75rem; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    #resultBox { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; background: #0f172a; display: none; border: 1px solid #334155; }
    .btn-download { display: inline-block; width: 100%; text-align: center; padding: 0.75rem; margin-top: 0.75rem; background: #16a34a; color: white; font-weight: bold; border-radius: 6px; text-decoration: none; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
    .btn-download:hover { background: #15803d; }
    .btn-yt { display: inline-block; width: 100%; text-align: center; padding: 0.6rem; margin-top: 0.5rem; background: transparent; color: #38bdf8; border: 1px solid #38bdf8; font-size: 0.9rem; border-radius: 6px; text-decoration: none; }
    .btn-yt:hover { background: rgba(56, 189, 248, 0.1); }
  </style>
</head>
<body>

<div class="card">
  <h2>AI Video Finder</h2>
  <p class="subtitle">No API | No Token Required</p>

  <div class="input-group">
    <label for="promptInput">Enter Video Prompt:</label>
    <input type="text" id="promptInput" value="banana dance" placeholder="e.g. banana dance">
  </div>

  <button onclick="generateVideo()">Generate Video</button>

  <div id="resultBox">
    <p style="margin: 0 0 10px 0; color: #94a3b8; font-size: 0.9rem;"><strong>Prompt:</strong> <span id="promptText" style="color: #fff;"></span></p>
    <a id="downloadBtn" href="#" target="_blank" class="btn-download">Download via SSYouTube</a>
    <a id="watchBtn" href="#" target="_blank" class="btn-yt">Watch Search Results on YouTube ↗</a>
  </div>
</div>

<script>
  function generateVideo() {
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) return alert('Karam karke query enter karein!');

    // URL Safe Query Builder
    const encodedQuery = encodeURIComponent(prompt);
    
    // SSYouTube Search and Download Routing Pattern
    const ssDownloadUrl = `https://ssyoutube.com/results?search_query=${encodedQuery}`;
    const ytWatchUrl = `https://www.youtube.com/results?search_query=${encodedQuery}`;

    // UI Updates
    document.getElementById('promptText').innerText = prompt;
    document.getElementById('downloadBtn').href = ssDownloadUrl;
    document.getElementById('watchBtn').href = ytWatchUrl;
    document.getElementById('resultBox').style.display = 'block';
  }
</script>

</body>
</html>
